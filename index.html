    <script>
      // Gracefully ignore WebSocket / Vite HMR disconnection errors inside iframe
      window.addEventListener('error', function (event) {
        if (event.message && (event.message.includes('WebSocket') || event.message.includes('vite') || event.message.includes('closed without opened'))) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (event.reason && String(event.reason).includes('WebSocket')) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
