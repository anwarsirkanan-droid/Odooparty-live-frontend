<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="50%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <!-- Inner circular badge -->
  <circle cx="256" cy="256" r="190" fill="#0f172a" opacity="0.4" />
  <!-- Microphone Icon -->
  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Mic Capsule -->
    <rect x="216" y="130" width="80" height="150" rx="40" />
    <!-- Stand Arc -->
    <path d="M176 220 c0 50 35 90 80 90 s80 -40 80 -90" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <!-- Stand Bar -->
    <line x1="256" y1="310" x2="256" y2="365" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <!-- Base -->
    <line x1="206" y1="365" x2="306" y2="365" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    <!-- Sound Waves / Crown -->
    <circle cx="150" cy="180" r="10" opacity="0.8" />
    <circle cx="362" cy="180" r="10" opacity="0.8" />
    <circle cx="130" cy="220" r="8" opacity="0.6" />
    <circle cx="382" cy="220" r="8" opacity="0.6" />
  </g>
  <text x="256" y="440" font-family="'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="2">MESO LIVE</text>
</svg>
